[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast native pipeline for the Shopping Sessions track"
publish = false

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[profile.profiling]
inherits = "release"
debug = true
